name: Deploy to GitHub Pages

on:
  push:
    # The repository has no `main` yet — this feature branch is the only one.
    # Add `main` here (and drop the other) once the work is merged.
    branches:
      - main
      - claude/personal-professional-website-jlhzqu
  # Allows publishing on demand from the Actions tab.
  workflow_dispatch:

# Allow the workflow to publish to Pages, nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The publish gate.
      #
      # `--warn-only` lets the site deploy while it is still a preview, so it
      # can be reviewed on a real device. It is safe because the page carries
      # a noindex tag for exactly as long as any placeholder remains, so a
      # half-finished page about a real person cannot be indexed.
      #
      # Remove `-- --warn-only` once the content is complete. The check then
      # becomes a hard gate again and an unfilled field fails the deploy.
      - name: Check for unfilled content
        run: npm run check -- --warn-only

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
