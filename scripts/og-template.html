<!doctype html>
<!--
  Source for public/og.png — the 1200×630 image shown when the URL is shared.

  It is a still life of the tape's own title card rather than a separate piece
  of art, so a link preview looks like the page it opens. Fonts and the
  photograph are pulled straight out of the repository, so this renders
  identically to the site.

  To regenerate after changing the copy: open this file in a browser, size the
  window to exactly 1200×630, and screenshot — or drive it headlessly:

    node -e "const {chromium}=require('playwright');(async()=>{
      const b=await chromium.launch();
      const p=await b.newPage({viewport:{width:1200,height:630}});
      await p.goto('file://'+process.cwd()+'/scripts/og-template.html');
      await p.waitForTimeout(600);
      await p.screenshot({path:'public/og.png'});
      await b.close();})()"

  Playwright is deliberately not a dependency of this project — the image
  changes about as often as the headline does, so it is generated once and
  committed rather than built on every deploy.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Anton';
        src: url('../node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2')
          format('woff2');
      }

      @font-face {
        font-family: 'Caveat Variable';
        font-weight: 400 700;
        src: url('../node_modules/@fontsource-variable/caveat/files/caveat-latin-wght-normal.woff2')
          format('woff2-variations');
      }

      @font-face {
        font-family: 'VT323';
        src: url('../node_modules/@fontsource/vt323/files/vt323-latin-400-normal.woff2')
          format('woff2');
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        gap: 58px;
        padding: 0 72px;
        background: radial-gradient(120% 90% at 50% 6%, #26122f 0%, #0e0715 54%, #08040d 100%);
      }

      /* ------------------------------------------------------- the cassette */

      .cassette {
        position: relative;
        flex: 0 0 auto;
        width: 430px;
        aspect-ratio: 5 / 3.5;
        padding: 13px;
        display: flex;
        flex-direction: column;
        gap: 11px;
        border-radius: 12px;
        background: linear-gradient(160deg, #2b1c3a, #170e22 58%, #0d0813);
        box-shadow:
          0 30px 70px rgb(0 0 0 / 75%),
          inset 0 1px 0 rgb(255 255 255 / 12%),
          inset 0 0 0 1px #4a3560;
        transform: rotate(-1.3deg);
      }

      .window {
        position: relative;
        flex: 1 1 auto;
        min-height: 64%;
        border-radius: 4px;
        overflow: hidden;
        background: #0a0610;
        box-shadow: inset 0 0 0 1px rgb(62 224 232 / 30%);
      }

      /* The spools, parked — a still image cannot show them turning. */
      .spool {
        position: absolute;
        top: 50%;
        width: 27%;
        aspect-ratio: 1;
        margin-top: -13.5%;
        border-radius: 999px;
        box-shadow: inset 0 0 0 5px rgb(8 4 13 / 50%);
      }

      .spool--left {
        left: 8%;
        border: 7px dashed rgb(246 239 230 / 50%);
      }

      .spool--right {
        right: 8%;
        border: 7px dashed rgb(246 239 230 / 34%);
      }

      .window img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 6%;
        filter: saturate(1.5) contrast(1.1) brightness(0.95);
      }

      .bleed {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
        background: linear-gradient(
          90deg,
          rgb(255 46 136 / 24%),
          transparent 32%,
          transparent 68%,
          rgb(62 224 232 / 24%)
        );
      }

      .rec {
        position: absolute;
        left: 13px;
        top: 11px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: 'VT323', monospace;
        font-size: 20px;
        letter-spacing: 0.12em;
        color: #fff;
        text-shadow: 0 1px 3px #000;
      }

      .rec i {
        width: 11px;
        height: 11px;
        border-radius: 999px;
        background: #ff2e88;
      }

      .scribble {
        position: absolute;
        right: 13px;
        bottom: 9px;
        font-family: 'Caveat Variable', cursive;
        font-weight: 700;
        font-size: 29px;
        color: #ffc53d;
        transform: rotate(-4deg);
        text-shadow: 0 2px 6px #000;
      }

      /* Two lines, since the second handoff added what the tape used to be
         called and struck it out. */
      .label {
        flex: 0 0 auto;
        padding: 7px 14px 9px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        border-radius: 4px;
        background: linear-gradient(#f7ecd8, #e3cfa6);
        transform: rotate(-0.5deg);
        box-shadow: 0 2px 8px rgb(0 0 0 / 50%);
      }

      .label__line {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      .label__name {
        font-family: 'Caveat Variable', cursive;
        font-weight: 700;
        font-size: 28px;
        line-height: 1.1;
        white-space: nowrap;
        color: #23142c;
      }

      .label__code {
        font-family: 'VT323', monospace;
        font-size: 16px;
        letter-spacing: 0.14em;
        color: #8a6b3d;
      }

      .label__was {
        font-family: 'VT323', monospace;
        font-size: 15px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #a08a6a;
      }

      .label__was s {
        text-decoration: line-through;
      }

      .label__was span {
        color: #8a6b3d;
      }

      /* ----------------------------------------------------------- the type */

      .words {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .kicker {
        font-family: 'VT323', monospace;
        font-size: 23px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #ffc53d;
      }

      /*
       * Three lines, and the middle one is her handwriting rather than another
       * line of stencil — which is the change the second handoff made to the
       * heading, and the reason this image had to be redrawn.
       */
      h1 {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        font-size: 84px;
        font-weight: 400;
        line-height: 0.82;
      }

      h1 b {
        font-family: 'Anton', Impact, sans-serif;
        font-weight: 400;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        color: #f6efe6;
        text-shadow:
          4px 0 0 #ff2e88,
          -4px 0 0 #3ee0e8;
      }

      /* The bottom line's fringe is reversed, so the pair frames the middle. */
      h1 b.flip {
        text-shadow:
          4px 0 0 #3ee0e8,
          -4px 0 0 #ff2e88;
      }

      h1 em {
        font-style: normal;
        font-family: 'Caveat Variable', cursive;
        font-weight: 700;
        font-size: 0.78em;
        line-height: 0.9;
        color: #ffc53d;
        transform: rotate(-2.5deg);
        margin: -0.04em 0 -0.06em;
      }

      .intro {
        max-width: 26ch;
        font-family: 'VT323', monospace;
        font-size: 27px;
        line-height: 1.35;
        letter-spacing: 0.04em;
        color: #c9b8d6;
      }

      .name {
        margin-top: 6px;
        font-family: 'VT323', monospace;
        font-size: 21px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #6f5b80;
      }

      /* --------------------------------------------------------- tape wear */

      .grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.5;
        mix-blend-mode: overlay;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/></filter><rect width="140" height="140" filter="url(%23n)"/></svg>');
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="cassette">
        <div class="window">
          <img src="../src/assets/photos/portrait.jpg" alt="" />
          <div class="bleed"></div>
          <span class="spool spool--left"></span>
          <span class="spool spool--right"></span>
          <div class="rec"><i></i>REC</div>
          <div class="scribble">that's me</div>
        </div>
        <div class="label">
          <span class="label__line">
            <b class="label__name">geetanjali raghav</b>
            <span class="label__code">E-180</span>
          </span>
          <span class="label__line label__was">
            <s>portfolio_final_v3</s>
            <span>2019 &mdash; 2026</span>
          </span>
        </div>
      </div>

      <div class="words">
        <p class="kicker">home video &middot; delhi &middot; e-180</p>
        <h1><b>No plot,</b><em>just good</em><b class="flip">footage</b></h1>
        <p class="intro">Seven reels. Salt water, hill roads, one motorcycle, a song.</p>
        <p class="name">Geetanjali Raghav</p>
      </div>

      <div class="grain"></div>
    </div>
  </body>
</html>
