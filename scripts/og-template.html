<!doctype html>
<!--
  Source for public/og.jpg — the 1200×630 image shown when the URL is shared.

  It is a still life of the tape's own title card rather than a separate piece
  of art, so a link preview looks like the page it opens. Fonts and the
  photograph are pulled straight out of the repository, so this renders
  identically to the site.

  THE TITLE CARD IS NOW A POSTER, and this was redrawn to match. It used to be a
  drawn cassette beside three lines of type, because that is what the card was;
  the third handoff replaced the cassette with a full-bleed photograph and a
  billing block, so this did too. The one difference is the shape: the card is
  portrait and a share image is 1200×630, so the plate sits in the left third
  rather than across the bottom — a lobby card rather than a one-sheet.

  Whatever changes here, `og:image:alt` in src/layouts/Base.astro describes this
  image in words and has to be changed with it.

  To regenerate after changing the copy: open this file in a browser, size the
  window to exactly 1200×630, and screenshot — or drive it headlessly with the
  Chromium already in the container (no need to add Playwright to this project;
  install it into a scratch directory with PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 and
  point executablePath at /opt/pw-browsers/chromium-1194/chrome-linux/chrome):

    const b = await chromium.launch({ executablePath: CHROMIUM });
    const p = await b.newPage({ viewport: { width: 1200, height: 630 } });
    await p.goto('file://' + process.cwd() + '/scripts/og-template.html');
    await p.waitForTimeout(600);
    await p.screenshot({ path: 'public/og.jpg', type: 'jpeg', quality: 86 });

  JPEG rather than PNG on purpose: the picture is mostly a photograph and a
  gradient, and the PNG of it was 896KB against 86KB here — above the size at
  which WhatsApp quietly declines to render a preview at all.

  Playwright is deliberately not a dependency of this project — the image
  changes about as often as the headline does, so it is generated once and
  committed rather than built on every deploy.

  AND BUMP `ASSET_VERSION` in src/layouts/Base.astro when you replace og.jpg.
  Slack, WhatsApp and LinkedIn cache a preview against the image URL more or
  less indefinitely, so a redrawn image under an unchanged name goes on showing
  the old headline to everyone who has already shared the link.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Anton';
        src: url('../node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2')
          format('woff2');
      }

      @font-face {
        font-family: 'Caveat Variable';
        font-weight: 400 700;
        src: url('../node_modules/@fontsource-variable/caveat/files/caveat-latin-wght-normal.woff2')
          format('woff2-variations');
      }

      @font-face {
        font-family: 'VT323';
        src: url('../node_modules/@fontsource/vt323/files/vt323-latin-400-normal.woff2')
          format('woff2');
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #08040d;
      }

      /* ----------------------------------------------------- the photograph */

      /*
       * Reel 03's Diwali photograph, cropped the same way the title card crops
       * it — into her face and the bangles stacked against it. The source is
       * square and this frame is 1.9:1, so the vertical position is what does
       * the work.
       */
      .card > img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 62% 12%;
        filter: saturate(1.45) contrast(1.14) brightness(0.84);
      }

      /*
       * Two scrims. The first darkens the left third so the type has something
       * to sit on; the second is the same top-and-bottom shading the card uses,
       * which keeps the photograph from ending abruptly at the edges.
       */
      .scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          100deg,
          rgb(8 4 13 / 96%) 0%,
          rgb(8 4 13 / 92%) 34%,
          rgb(8 4 13 / 55%) 56%,
          rgb(8 4 13 / 12%) 82%,
          rgb(8 4 13 / 4%) 100%
        );
      }

      .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgb(8 4 13 / 55%) 0%,
          rgb(8 4 13 / 6%) 26%,
          rgb(8 4 13 / 30%) 70%,
          rgb(8 4 13 / 80%) 100%
        );
      }

      /* The tape's mis-registered colour bleed, as on every screen. */
      .bleed {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          96deg,
          rgb(255 46 136 / 14%),
          transparent 40%,
          transparent 62%,
          rgb(62 224 232 / 14%)
        );
      }

      /* ----------------------------------------------------------- the plate */

      .plate {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 66%;
        padding: 0 64px 58px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 18px;
      }

      .name {
        font-family: 'Caveat Variable', cursive;
        font-weight: 700;
        font-size: 42px;
        line-height: 1;
        color: #ffc53d;
        transform: rotate(-1.6deg);
        transform-origin: left center;
        text-shadow: 0 2px 10px rgb(0 0 0 / 70%);
      }

      /*
       * Three lines, and the middle one is her handwriting rather than another
       * line of stencil. Left-aligned, as the poster sets them.
       */
      h1 {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        font-size: 96px;
        font-weight: 400;
        line-height: 0.8;
      }

      h1 b {
        font-family: 'Anton', Impact, sans-serif;
        font-weight: 400;
        letter-spacing: -0.025em;
        text-transform: uppercase;
        color: #f6efe6;
        text-shadow:
          4px 0 0 #ff2e88,
          -4px 0 0 #3ee0e8;
      }

      /* The bottom line's fringe is reversed, so the pair frames the middle. */
      h1 b.flip {
        text-shadow:
          4px 0 0 #3ee0e8,
          -4px 0 0 #ff2e88;
      }

      h1 em {
        font-style: normal;
        font-family: 'Caveat Variable', cursive;
        font-weight: 700;
        font-size: 0.62em;
        line-height: 0.92;
        color: #ffc53d;
        transform: rotate(-2.2deg);
        transform-origin: left center;
        margin: -0.02em 0 -0.04em 0.06em;
      }

      /* The billing block, under a gold hairline, as a poster prints it. */
      .bill {
        align-self: stretch;
        padding-top: 14px;
        border-top: 1px solid rgb(255 197 61 / 40%);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .bill p {
        font-family: 'VT323', monospace;
        font-size: 21px;
        line-height: 1.32;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .bill .reels {
        color: #f0d3b8;
      }

      .bill .footer {
        color: #a5919b;
      }

      /* --------------------------------------------------------- tape wear */

      .grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        /*
         * Heavier than a reel, because the title card is the head of the tape and
         * the wear curve peaks there — see `wear` in src/data/tape.ts.
         */
        opacity: 0.34;
        mix-blend-mode: overlay;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/></filter><rect width="140" height="140" filter="url(%23n)"/></svg>');
      }
    </style>
  </head>

  <body>
    <div class="card">
      <img src="../src/assets/photos/red-and-gold.jpg" alt="" />
      <div class="shade"></div>
      <div class="scrim"></div>
      <div class="bleed"></div>

      <div class="plate">
        <p class="name">geetanjali raghav</p>

        <h1><b>No plot,</b><em>just good</em><b class="flip">footage</b></h1>

        <div class="bill">
          <p class="reels">
            in seven reels &middot; salt water &middot; two wheels &middot; any excuse &middot; take
            four &middot; cold air &middot; playback &middot; side a
          </p>
          <p class="footer">
            filmed on location in delhi, the hills and the sea &middot; one interval &middot;
            running time 45 min &middot; u/a
          </p>
        </div>
      </div>

      <div class="grain"></div>
    </div>
  </body>
</html>
